services:
  mysql:
    image: mysql:8.0
    container_name: permisos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-SistemaPermisos}
      MYSQL_USER: ${MYSQL_USER:-permisos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - permisos_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --default-time-zone=-05:00

  adminer:
    image: adminer:latest
    container_name: permisos-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  permisos_mysql_data: